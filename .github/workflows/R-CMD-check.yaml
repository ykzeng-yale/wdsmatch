name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release', manual: true}
          - {os: ubuntu-latest, r: 'devel', manual: false, http-user-agent: 'release'}
          - {os: windows-latest, r: 'release', manual: false}
          - {os: macos-latest, r: 'release', manual: false}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: true
      _R_CHECK_CRAN_INCOMING_: true
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytex
          needs: check
      - name: Install TeX for the release manual check
        if: matrix.config.manual
        shell: Rscript {0}
        run: |
          tinytex::install_tinytex()
          tex_bin <- dirname(Sys.glob(file.path(tinytex::tinytex_root(), "bin", "*", "pdflatex")))
          stopifnot(length(tex_bin) == 1L)
          cat(tex_bin, file = Sys.getenv("GITHUB_PATH"), append = TRUE, sep = "\n")
      - name: Compare against the frozen simulation estimator
        shell: bash
        run: Rscript --vanilla validation/core_equivalence.R . validation/frozen_reference_core.R check/reference-parity
      - name: Build and check the source tarball
        shell: Rscript {0}
        run: |
          dir.create("check", showWarnings = FALSE)
          pkg <- pkgbuild::build(".", dest_path = Sys.getenv("RUNNER_TEMP"), manual = TRUE)
          file.copy(pkg, "check", overwrite = TRUE)
          args <- c("--as-cran", if (!as.logical("${{ matrix.config.manual }}")) "--no-manual")
          result <- rcmdcheck::rcmdcheck(pkg, args = args, check_dir = "check", error_on = "never")
          saveRDS(result, "check/check-result.rds")
          writeLines(c(R.version.string, capture.output(sessionInfo())), "check/session-info.txt")
          if (length(result$errors) || length(result$warnings)) stop("R CMD check reported errors or warnings")
      - name: Upload tarball and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-R-${{ matrix.config.r }}
          path: check
          if-no-files-found: warn
